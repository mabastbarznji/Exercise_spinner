<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Workout Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; padding: 20px; min-height: 100vh; }
    .card { background: #1e293b; border: 1px solid #334155; width: 100%; max-width: 440px; border-radius: 16px; padding: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; position: relative; }
    h1 { font-size: 22px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; text-align: center; }
    
    /* Login Gate Styling */
    .auth-gate { display: flex; flex-direction: column; }
    .auth-title { font-size: 18px; font-weight: 700; color: #f8fafc; margin-bottom: 6px; text-align: center; }
    .auth-sub { font-size: 13px; color: #94a3b8; margin-bottom: 20px; text-align: center; }
    .auth-input { width: 100%; padding: 12px; margin-bottom: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; outline: none; }
    .auth-input:focus { border-color: #3b82f6; }
    .auth-buttons { display: flex; gap: 10px; margin-top: 4px; }
    .btn-auth { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-signup { background: #16a34a; color: white; }
    .btn-signup:hover { background: #15803d; }
    .btn-login { background: #2563eb; color: white; }
    .btn-login:hover { background: #1d4ed8; }
    .auth-status { margin-top: 14px; font-size: 13px; font-weight: 600; text-align: center; }

    /* Main App Interface (Hidden by Default) */
    .app-content { display: none; }
    .user-bar { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #334155; }
    .user-email-text { font-size: 12px; font-weight: 600; color: #38bdf8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
    .btn-logout { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .btn-logout:hover { background: #b91c1c; }

    .streak-box { text-align: center; font-size: 15px; font-weight: 700; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(56, 189, 248, 0.2); }
    .streak-warning { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .level-label { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; text-align: center; }
    .mode-selection { display: flex; gap: 8px; margin-bottom: 16px; }
    .mode-btn { flex: 1; padding: 10px 4px; border: 1px solid #334155; background: #0f172a; color: #94a3b8; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .mode-btn.active { background: #2563eb; color: #ffffff; border-color: #3b82f6; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4); }
    .spinner-display { height: 120px; display: flex; align-items: center; justify-content: center; background: #0f172a; border-radius: 12px; margin-bottom: 16px; border: 1px solid #334155; text-align: center; padding: 15px; }
    .spin-text { font-size: 18px; font-weight: 600; color: #64748b; }
    .result-box { display: none; text-align: left; margin-bottom: 20px; }
    .exercise-title { font-size: 24px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .reps-text { font-size: 16px; font-weight: 600; color: #38bdf8; margin-bottom: 14px; }
    .tutorial-text { font-size: 13px; color: #cbd5e1; line-height: 1.5; background: #0f172a; padding: 14px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 16px; }
    .btn { background: #2563eb; color: #ffffff; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .btn:hover { background: #1d4ed8; }
    .btn-rest { background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; margin-top: 8px; box-shadow: none; }
    .btn-rest:hover { background: rgba(56, 189, 248, 0.1); }
    .timer-container { display: none; margin-top: 12px; text-align: center; }
    .timer-display { font-size: 32px; font-weight: 700; color: #38bdf8; transition: color 0.3s ease; }
    .timer-display.time-up { color: #ef4444; font-size: 28px; }
    .timer-controls { display: flex; gap: 8px; margin-top: 8px; }
    .btn-timer-opt { flex: 1; background: #0f172a; color: #94a3b8; border: 1px solid #334155; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-timer-opt:hover { background: #334155; color: #ffffff; }
    .confirm-box { display: none; margin-top: 15px; text-align: center; background: #0f172a; padding: 14px; border-radius: 8px; border: 1px solid #334155; }
    .confirm-title { font-size: 14px; font-weight: 600; color: #f8fafc; margin-bottom: 12px; }
    .confirm-buttons { display: flex; gap: 8px; }
    .btn-yes { background: #16a34a; color: white; border: none; flex: 1; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-yes:hover { background: #15803d; }
    .btn-no { background: #dc2626; color: white; border: none; flex: 1; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-no:hover { background: #b91c1c; }
    .feedback-msg { display: none; text-align: center; font-size: 14px; font-weight: 600; margin-top: 12px; padding: 10px; border-radius: 6px; }
    .msg-success { background: rgba(22, 163, 74, 0.15); color: #4ade80; border: 1px solid rgba(22, 163, 74, 0.3); }
    .msg-fail { background: rgba(220, 38, 38, 0.15); color: #f87171; border: 1px solid rgba(220, 38, 38, 0.3); }
    .manual-picker-section { margin-top: 24px; padding-top: 20px; border-top: 1px dashed #334155; }
    .select-dropdown { width: 100%; padding: 12px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; font-size: 14px; font-weight: 600; outline: none; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    
    <div id="authGate" class="auth-gate">
      <div class="auth-title">Welcome Player</div>
      <div class="auth-sub">Enter your email and password to start playing</div>
      <input type="email" id="auth-email" class="auth-input" placeholder="Email (e.g. user@gmail.com)" required />
      <input type="password" id="auth-password" class="auth-input" placeholder="Password (min 6 chars)" required />
      <div class="auth-buttons">
        <button class="btn-auth btn-signup" onclick="handleAuth('signup')">Sign Up</button>
        <button class="btn-auth btn-login" onclick="handleAuth('login')">Log In</button>
      </div>
      <p id="auth-message" class="auth-status"></p>
    </div>

    <div id="appContent" class="app-content">
      <div class="user-bar">
        <span id="userDisplay" class="user-email-text">👤 User</span>
        <button class="btn-logout" onclick="logout()">Log Out</button>
      </div>

      <h1>Workout Generator</h1>

      <div class="streak-box" id="streakDisplay">🔥 Daily Streak: 0 Days</div>

      <div class="level-label">Select Intensity Level</div>
      <div class="mode-selection">
        <button class="mode-btn active" id="btn-beginner" onclick="setMode('beginner', this)">Beginner</button>
        <button class="mode-btn" id="btn-intermediate" onclick="setMode('intermediate', this)">Intermediate</button>
        <button class="mode-btn" id="btn-pro" onclick="setMode('pro', this)">Pro</button>
      </div>

      <div class="spinner-display" id="spinDisplay">
        <div class="spin-text" id="displayText">Pick a level & press Spin</div>
      </div>

      <button class="btn" id="spinBtn" onclick="spinExercise()">🎲 Spin Random Exercise</button>

      <div class="result-box" id="resultBox">
        <div class="tutorial-text" id="exTut"></div>
        <button class="btn btn-rest" id="restBtn" onclick="startRest()">Start Rest</button>

        <div class="timer-container" id="timerContainer">
          <div class="timer-display" id="timer">0</div>
          <div class="timer-controls" id="timerControls">
            <button class="btn-timer-opt" onclick="addRestTime(10)">+10s</button>
            <button class="btn-timer-opt" onclick="skipRest()">Skip Rest</button>
          </div>
        </div>
        
        <div class="confirm-box" id="confirmBox">
          <div class="confirm-title">Did you complete the set?</div>
          <div class="confirm-buttons">
            <button class="btn-yes" onclick="handleCompletion(true)">Yes</button>
            <button class="btn-no" onclick="handleCompletion(false)">No</button>
          </div>
        </div>

        <div class="feedback-msg" id="feedbackMsg"></div>
      </div>

      <div class="manual-picker-section">
        <div class="level-label">Or Pick Manually</div>
        <select class="select-dropdown" id="exerciseSelect" onchange="selectManualExercise()">
          <option value="">-- Choose an Exercise --</option>
        </select>
      </div>
    </div>

  </div>

  <script>
    let currentMode = 'beginner';
    let timerInterval = null;
    let secondsLeft = 0;
    let streakCount = parseInt(localStorage.getItem('workoutStreak') || '0');
    let lastWorkoutDateStr = localStorage.getItem('lastWorkoutDateStr');
    let currentRestTime = 30;

    const exercises = [
      { name: "Pull-Ups", beginner: "3 Reps", intermediate: "7 Reps", pro: "12 Reps", rest: { beginner: 45, intermediate: 60, pro: 90 }, tut: "Grip the bar palms facing away, pull your chest up to the bar, and lower down under full control." },
      { name: "Push-Ups", beginner: "5 Reps", intermediate: "12 Reps", pro: "25 Reps", rest: { beginner: 25, intermediate: 40, pro: 60 }, tut: "Keep your hands shoulder-width apart, keep your back straight, and lower your chest near the floor." },
      { name: "Plank", beginner: "15 Seconds", intermediate: "35 Seconds", pro: "60 Seconds", rest: { beginner: 20, intermediate: 30, pro: 45 }, tut: "Hold your body flat on your forearms and toes. Engage your core and keep your hips aligned." },
      { name: "Bodyweight Squats", beginner: "8 Reps", intermediate: "18 Reps", pro: "30 Reps", rest: { beginner: 20, intermediate: 35, pro: 50 }, tut: "Keep feet shoulder-width apart, lower your hips as if sitting down, and push up through your heels." },
      { name: "Lunges", beginner: "4 Reps / leg", intermediate: "10 Reps / leg", pro: "16 Reps / leg", rest: { beginner: 25, intermediate: 35, pro: 50 }, tut: "Step forward, drop your back knee close to the floor at 90 degrees, then push back to start." },
      { name: "Mountain Climbers", beginner: "10 Reps", intermediate: "24 Reps", pro: "40 Reps", rest: { beginner: 20, intermediate: 30, pro: 45 }, tut: "In a high plank position, drive your knees toward your chest quickly in an alternating motion." }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      populateDropdown();
      checkStreakExpiry();
      updateStreakDisplay();
      checkLoginSession();
    });

    function handleAuth(type) {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const message = document.getElementById('auth-message');

      // Validates proper email structure (e.g., user@domain.com)
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailPattern.test(email)) {
        message.style.color = '#f87171';
        message.innerText = 'Error: Enter a valid email (e.g. name@gmail.com)';
        return;
      }

      if (password.length < 6) {
        message.style.color = '#f87171';
        message.innerText = 'Error: Password must be at least 6 characters.';
        return;
      }

      if (type === 'signup') {
        localStorage.setItem('workoutUser_' + email, password);
        localStorage.setItem('loggedInUser', email);
        unlockApp(email);
      } else if (type === 'login') {
        const storedPassword = localStorage.getItem('workoutUser_' + email);
        if (storedPassword === password) {
          localStorage.setItem('loggedInUser', email);
          unlockApp(email);
        } else if (!storedPassword) {
          message.style.color = '#f87171';
          message.innerText = 'Account does not exist. Please click Sign Up.';
        } else {
          message.style.color = '#f87171';
          message.innerText = 'Incorrect password.';
        }
      }
    }

    function checkLoginSession() {
      const activeUser = localStorage.getItem('loggedInUser');
      if (activeUser) {
        unlockApp(activeUser);
      }
    }

    function unlockApp(email) {
      document.getElementById('authGate').style.display = 'none';
      document.getElementById('appContent').style.display = 'block';
      document.getElementById('userDisplay').innerText = `👤 ${email}`;
    }

    function logout() {
      localStorage.removeItem('loggedInUser');
      document.getElementById('appContent').style.display = 'none';
      document.getElementById('authGate').style.display = 'flex';
      document.getElementById('auth-email').value = '';
      document.getElementById('auth-password').value = '';
      document.getElementById('auth-message').innerText = '';
    }

    function populateDropdown() {
      const select = document.getElementById('exerciseSelect');
      select.innerHTML = '<option value="">-- Choose an Exercise --</option>';
      exercises.forEach((ex, idx) => {
        const option = document.createElement('option');
        option.value = idx;
        option.innerText = ex.name;
        select.appendChild(option);
      });
    }

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function checkStreakExpiry() {
      if (!lastWorkoutDateStr) return;
      const today = new Date(getTodayString());
      const lastDate = new Date(lastWorkoutDateStr);
      const diffTime = today - lastDate;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays > 1) {
        streakCount = 0;
        localStorage.setItem('workoutStreak', '0');
        const streakBox = document.getElementById('streakDisplay');
        streakBox.classList.add('streak-warning');
        streakBox.innerText = `⚠️ Streak Lost! You missed a day.`;
      }
    }

    function updateStreakDisplay() {
      const streakBox = document.getElementById('streakDisplay');
      if (!streakBox.classList.contains('streak-warning')) {
        streakBox.innerText = `🔥 Daily Streak: ${streakCount} Day${streakCount === 1 ? '' : 's'}`;
      }
    }

    function setMode(mode, element) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      const select = document.getElementById('exerciseSelect');
      if (select.value !== "") selectManualExercise();
    }

    function selectManualExercise() {
      const select = document.getElementById('exerciseSelect');
      if (select.value === "") return;
      displayExerciseInfo(exercises[select.value]);
    }

    function displayExerciseInfo(finalEx) {
      const display = document.getElementById('spinDisplay');
      const resultBox = document.getElementById('resultBox');
      const restBtn = document.getElementById('restBtn');
      const timerContainer = document.getElementById('timerContainer');
      const timerDisplay = document.getElementById('timer');
      const confirmBox = document.getElementById('confirmBox');
      const feedbackMsg = document.getElementById('feedbackMsg');

      clearInterval(timerInterval);
      timerContainer.style.display = 'none';
      timerDisplay.classList.remove('time-up');
      confirmBox.style.display = 'none';
      feedbackMsg.style.display = 'none';

      const reps = finalEx[currentMode];
      currentRestTime = finalEx.rest[currentMode];

      display.innerHTML = `<div><div class="exercise-title">${finalEx.name}</div><div class="reps-text">${reps} (${currentMode.toUpperCase()})</div></div>`;
      document.getElementById('exTut').innerHTML = `<strong>Form Guide:</strong> ${finalEx.tut}`;
      restBtn.innerText = `Start ${currentRestTime}s Rest`;
      restBtn.style.display = 'block';
      resultBox.style.display = 'block';
    }

    function spinExercise() {
      document.getElementById('exerciseSelect').value = "";
      const display = document.getElementById('spinDisplay');
      const resultBox = document.getElementById('resultBox');
      const spinBtn = document.getElementById('spinBtn');
      const timerContainer = document.getElementById('timerContainer');
      const timerDisplay = document.getElementById('timer');
      const confirmBox = document.getElementById('confirmBox');
      const feedbackMsg = document.getElementById('feedbackMsg');

      clearInterval(timerInterval);
      timerContainer.style.display = 'none';
      timerDisplay.classList.remove('time-up');
      confirmBox.style.display = 'none';
      feedbackMsg.style.display = 'none';
      resultBox.style.display = 'none';
      spinBtn.disabled = true;

      let counter = 0;
      const shuffleInterval = setInterval(() => {
        const randomEx = exercises[Math.floor(Math.random() * exercises.length)];
        display.innerHTML = `<div class="spin-text">${randomEx.name}</div>`;
        counter++;
        if (counter > 12) {
          clearInterval(shuffleInterval);
          const finalEx = exercises[Math.floor(Math.random() * exercises.length)];
          displayExerciseInfo(finalEx);
          spinBtn.disabled = false;
        }
      }, 100);
    }

    function startRest() {
      const restBtn = document.getElementById('restBtn');
      const timerContainer = document.getElementById('timerContainer');
      const timerDisplay = document.getElementById('timer');
      const timerControls = document.getElementById('timerControls');
      
      restBtn.style.display = 'none';
      timerContainer.style.display = 'block';
      timerControls.style.display = 'flex';
      timerDisplay.classList.remove('time-up');
      secondsLeft = currentRestTime;
      timerDisplay.innerText = secondsLeft;
      runTimer();
    }

    function runTimer() {
      const timerDisplay = document.getElementById('timer');
      const timerControls = document.getElementById('timerControls');
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsLeft--;
        timerDisplay.innerText = secondsLeft;
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          timerDisplay.innerText = "TIME IS UP!";
          timerDisplay.classList.add('time-up');
          timerControls.style.display = 'none';
          document.getElementById('confirmBox').style.display = 'block';
        }
      }, 1000);
    }

    function addRestTime(seconds) {
      secondsLeft += seconds;
      document.getElementById('timer').innerText = secondsLeft;
    }

    function skipRest() {
      clearInterval(timerInterval);
      const timerDisplay = document.getElementById('timer');
      const timerControls = document.getElementById('timerControls');
      timerDisplay.innerText = "TIME IS UP!";
      timerDisplay.classList.add('time-up');
      timerControls.style.display = 'none';
      document.getElementById('confirmBox').style.display = 'block';
    }

    function handleCompletion(didComplete) {
      const feedbackMsg = document.getElementById('feedbackMsg');
      const streakBox = document.getElementById('streakDisplay');
      streakBox.classList.remove('streak-warning');
      document.getElementById('confirmBox').style.display = 'none';
      feedbackMsg.style.display = 'block';

      if (didComplete) {
        confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
        const todayStr = getTodayString();
        if (lastWorkoutDateStr !== todayStr) {
          streakCount++;
          lastWorkoutDateStr = todayStr;
          localStorage.setItem('workoutStreak', streakCount.toString());
          localStorage.setItem('lastWorkoutDateStr', todayStr);
          updateStreakDisplay();
          feedbackMsg.className = 'feedback-msg msg-success';
          feedbackMsg.innerText = "🎉 Great job! Streak extended!";
        } else {
          feedbackMsg.className = 'feedback-msg msg-success';
          feedbackMsg.innerText = "💪 Bonus set finished!";
        }
      } else {
        feedbackMsg.className = 'feedback-msg msg-fail';
        feedbackMsg.innerText = "No worries! Try again next set.";
      }
    }
  </script>
</body>
